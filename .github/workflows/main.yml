name: Build x86_64 QPKG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qpkg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QDK_VERSION: "2.5.3"
  QDK_DEB_SHA256: "17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022"
  MINISERVE_VERSION: "0.35.0"
  MINISERVE_SHA256: "c630ee030d5d9d83c88c5cc72f43ae215b0c214d64fd7afc92244fe369af2964"

jobs:
  build:
    name: Build and verify x86_64 QPKG
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install QDK and musl toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          curl -fsSL \
            -o /tmp/qdk.deb \
            "https://github.com/qnap-dev/QDK/releases/download/v${QDK_VERSION}/qdk_${QDK_VERSION}_amd64.deb"
          echo "${QDK_DEB_SHA256}  /tmp/qdk.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/qdk.deb
          qbuild --version

      - name: Install Rust target
        shell: bash
        run: |
          set -euxo pipefail
          rustup target add x86_64-unknown-linux-musl
          rustc --version
          cargo --version

      - name: Download verified miniserve binary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p x86_64/bin
          curl -fsSL \
            -o x86_64/bin/miniserve \
            "https://github.com/svenstaro/miniserve/releases/download/v${MINISERVE_VERSION}/miniserve-${MINISERVE_VERSION}-x86_64-unknown-linux-musl"
          echo "${MINISERVE_SHA256}  x86_64/bin/miniserve" | sha256sum -c -
          chmod 0755 x86_64/bin/miniserve

      - name: Test and build manager
        shell: bash
        run: |
          set -euxo pipefail
          cargo fmt --check
          cargo test --locked
          cargo build --locked --release --target x86_64-unknown-linux-musl
          install -m 0755 \
            target/x86_64-unknown-linux-musl/release/miniserve-qnap-manager \
            x86_64/bin/miniserve-qnap-manager
          file x86_64/bin/miniserve x86_64/bin/miniserve-qnap-manager

      - name: Smoke-test authenticated services
        shell: bash
        run: |
          set -euxo pipefail
          scripts/smoke-test.sh \
            x86_64/bin/miniserve-qnap-manager \
            x86_64/bin/miniserve

      - name: Build and verify QPKG
        shell: bash
        run: |
          set -euxo pipefail
          package_version="$(sed -n 's/^QPKG_VER="\([^"]*\)"/\1/p' qpkg.cfg)"
          test -n "${package_version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${package_version}"
          fi
          qbuild --build-arch x86_64 --strict
          (
            cd build
            md5sum "miniserve-qnap_${package_version}_x86_64.qpkg" \
              > "miniserve-qnap_${package_version}_x86_64.qpkg.md5"
          )
          scripts/verify-qpkg.sh \
            "build/miniserve-qnap_${package_version}_x86_64.qpkg"

      - name: Upload QPKG artifact
        uses: actions/upload-artifact@v7
        with:
          name: miniserve-qnap-x86_64
          path: |
            build/*.qpkg
            build/*.qpkg.md5
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: miniserve-qnap-x86_64
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.qpkg \
            dist/*.qpkg.md5 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Miniserve for QNAP ${GITHUB_REF_NAME}" \
            --generate-notes
